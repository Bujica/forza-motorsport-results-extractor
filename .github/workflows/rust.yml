name: rust

on:
  push:
    branches: [dev, main]
    # NOTE: .gitattributes is included on purpose — it controls line endings
    # of byte-embedded assets/fixtures, so a change there can break golden
    # hashes without touching a single .rs file (seen 2026-09-04).
    paths: ["forza-rust/**", ".github/workflows/rust.yml", ".gitattributes"]
  pull_request:
    paths: ["forza-rust/**", ".github/workflows/rust.yml", ".gitattributes"]

defaults:
  run:
    working-directory: forza-rust

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
