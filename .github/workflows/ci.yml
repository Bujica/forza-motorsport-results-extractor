name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      # Rust-only changes are covered by rust.yml; the Python line is
      # frozen at 0.21.0 (legacy reference) — skip its CI there.
      - 'forza-rust/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'forza-rust/**'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,gui]"

      - name: Compile package
        run: python -m compileall -q forza

      - name: Run tests
        run: pytest
