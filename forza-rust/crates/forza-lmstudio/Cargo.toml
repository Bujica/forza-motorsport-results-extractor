[package]
name = "forza-lmstudio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
forza-domain = { path = "../forza-domain" }

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3"

[lints]
workspace = true

[package.metadata.notes]
repair = "json repair kept minimal: real malformed fixtures fail on validation, not JSON syntax (see docs/plans/rust_migration_progress.md Sessão 7)"
